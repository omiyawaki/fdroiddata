MaintainerNotes: |-
  Build from public osrswiki-android repo root (gradlew at root; app in
  subdir app).

  Flavor: distribution=foss (productFlavors play|foss).
  Explicit task: ./gradlew :app:assembleFossRelease
  F-Droid gradle: [foss] with subdir app runs assembleFossRelease.

  Reproducible: Binaries from GitHub Releases (v%v/app-foss-release.apk)
  with AllowedAPKSigningKeys.

  Notes:
    - SpeechRecognizer is optional platform API; not a proprietary dependency.
    - No Play Billing / billingclient on fossRuntimeClasspath.
    - Charts: Chart.js (MIT), not Highcharts.
    - applicationId is com.omiyawaki.osrswiki (same as Play).
    - Store listing copy + images: upstream fastlane/metadata/android/.
    - MapLibre sanitizer is vendored at undergroundmaps/sanitize_osrs_maplibre_aar.py.

