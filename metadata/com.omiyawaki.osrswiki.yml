AutoName: OSRS Wiki

Summary: Unofficial Old School RuneScape wiki reader
Description: |-
    Unofficial client for the Old School RuneScape Wiki. Browse articles,
    search, read offline, and view the game map.

    This F-Droid package is the foss distribution flavor: no Google Play
    Billing, and Grand Exchange charts use Chart.js (MIT) rather than
    Highcharts.

    Network: the app loads content from the public wiki and related
    community APIs (NonFreeNet). Voice search uses the optional Android
    SpeechRecognizer platform API when available and degrades when it is
    not.

    Tips: the foss build does not include Play Billing / in-app purchases.
    Support development via GitHub Sponsors: https://github.com/sponsors/omiyawaki

MaintainerNotes: |-
    Build from public osrswiki-android repo root (gradlew at root).

    Flavor: distribution=foss (productFlavors play|foss).
    Explicit task: ./gradlew :app:assembleFossRelease
    F-Droid gradle: [foss] runs assembleFossRelease.

    Expected APK (unsigned on buildserver):
      app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk

    Notes:
      - SpeechRecognizer is optional platform API; not a proprietary dependency.
      - No Play Billing / billingclient on fossRuntimeClasspath.
      - Charts: Chart.js (MIT), not Highcharts.
      - applicationId is com.omiyawaki.osrswiki (same as Play).

